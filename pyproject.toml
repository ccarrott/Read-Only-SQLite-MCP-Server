[project]
name = "sqlite-mcp-server"
version = "0.1.0"
description = "Safe Read-Only SQLite Explorer MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
sqlite-mcp = "sqlite_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
